name: Render plugin icon
on:
  push:
    paths:
      - assets/target-history-icon.svg
      - .github/workflows/render-icon.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 256 -h 256 assets/target-history-icon.svg -o assets/target-history-icon.png
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/target-history-icon.png
          git diff --cached --quiet || (git commit -m "Render Target History icon PNG" && git push)
