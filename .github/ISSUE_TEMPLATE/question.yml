name: Question
description: Ask for help using Target History
title: "[Question] "
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Target History version (optional)
      placeholder: "e.g. 0.2.0.0"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Include screenshots or steps already tried.
    validations:
      required: false
